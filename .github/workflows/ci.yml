name: CI

on:
  push:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.releaserc*'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'examples/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'eslint.config.*'
      - '.releaserc*'
      - '.github/workflows/**'
      - 'scripts/**'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docs/**'
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PUPPETEER_SKIP_DOWNLOAD: 'true'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Do not interrupt a main-branch release while it is writing tags/metadata.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test & Lint (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Run tests with coverage
        run: npm run test:coverage -- --runInBand
      - name: Check CLI and package contents
        run: |
          node dist/cli.js --help
          npm pack --dry-run

  release:
    name: Release
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Semantic Release (GitHub only; npm publishing disabled)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install semantic-release
